<!-- SVG refraction filter -->
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <filter id="refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="4" result="noise" />
    <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="40" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>

<div class="backdrop" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
</div>

<nav class="nav glass" aria-label="Main">
  <a class="brand" routerLink="/showcase"><i></i><span>Liquid Glass</span></a>
  
  <div class="view-switch">
    <a
      class="view-switch-btn"
      routerLink="/showcase"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
    >
      🌟 {{ t('nav.showcase') }}
    </a>
    <a
      class="view-switch-btn"
      routerLink="/wiki"
      routerLinkActive="active"
    >
      📚 {{ t('nav.wiki') }}
    </a>
  </div>

  <div class="nav-links">
    @if (installEvent()) {
      <button class="btn glass" style="padding: 0.4rem 0.9rem; font-size: 0.8rem;" (click)="install()">
        ⬇ {{ t('hero.install') }}
      </button>
    }
    <button class="lang-btn" id="lang-toggle" (click)="i18n.toggle()" aria-label="Language">
      {{ i18n.lang() === 'pt' ? 'EN' : 'PT' }}
    </button>
  </div>
</nav>

<main class="app-router-wrapper">
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  <p>{{ t('footer') }}</p>
</footer>
